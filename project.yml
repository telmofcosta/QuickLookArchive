name: ArchiveLook
options:
  bundleIdPrefix: local.archivelook
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  ArchiveLook:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.archivelook.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ArchiveLook
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
    dependencies:
      - target: ArchiveLookPreview
        embed: true
  ArchiveLookPreview:
    type: app-extension
    platform: macOS
    sources: [Extension]
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: ArchiveLook Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.zip-archive
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    entitlements:
      path: Extension/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.archivelook.app.preview
        SWIFT_OBJC_BRIDGING_HEADER: Extension/CArchive.h
        OTHER_LDFLAGS: -larchive
