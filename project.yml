name: QuickLookArchive
options:
  bundleIdPrefix: pt.telmofcosta
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  QuickLookArchive:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QuickLookArchive
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.telmofcosta.quicklookarchive
    dependencies:
      - target: QuickLookArchivePreview
        embed: true
  QuickLookArchivePreview:
    type: app-extension
    platform: macOS
    sources: [Extension]
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: QuickLookArchive Preview
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.zip-archive
              - public.tar-archive
              - org.gnu.gnu-zip-archive
              - org.gnu.gnu-zip-tar-archive
              - public.bzip2-archive
              - public.tar-bzip2-archive
              - org.tukaani.xz-archive
              - org.tukaani.tar-xz-archive
              - public.lzip-archive
              - public.z-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - public.cpio-archive
              - com.apple.xar-archive
              - public.iso-image
              - com.microsoft.cab
              - public.archive.lha
              - com.sun.java-archive
              - com.sun.web-application-archive
              - public.archive.apk
              - org.idpf.epub-container
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    entitlements:
      path: Extension/Extension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pt.telmofcosta.quicklookarchive.preview
        SWIFT_OBJC_BRIDGING_HEADER: Extension/CArchive.h
        OTHER_LDFLAGS: -larchive
